name: Bug report
description: Something is detected wrongly, missed, or crashes
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do not attach application binaries. For security issues, use the Security tab instead.
  - type: input
    id: version
    attributes:
      label: appxray version
      description: Output of `appxray --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 23H2 / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the app name and version if a detection is wrong.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report excerpt
      description: Output of `appxray inspect "<app folder>" --format json --redact-paths` (trim as needed)
      render: json
