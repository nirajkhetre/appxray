version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    # REA upgrades arrive as their own pull request. CI runs the real-REA contract test on them;
    # REA_TESTED_RANGE in src/rea/runner.ts must be raised deliberately after reviewing changes.
    allow:
      - dependency-type: all
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
