name: Refresh vulnerability data

# Rebuilds data/appxray-db.json from npm, the GitHub Advisory Database, CISA KEV, the CVE
# List and Electron release notes, and opens a pull request when it changed.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Rebuild database
        run: node dist/cli.js db update --output data/appxray-db.json
        env:
          # Read-only use of the public GitHub API for Electron release notes.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require release-note coverage
        run: |
          node -e "const db=require('./data/appxray-db.json'); if(!db.coverage.releaseNoteMajors.length){console.error('release notes missing');process.exit(1)}"
      - run: node dist/cli.js db info --db data/appxray-db.json
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/data-refresh
          commit-message: 'data: refresh vulnerability database'
          title: 'data: refresh vulnerability database'
          body: Automated refresh of `data/appxray-db.json` from public sources. Review `db info` output in the workflow log.
          labels: data
          delete-branch: true
